name: Weekly Task Completion Sync

# Pulls last week's checklist completion data from the Daily Checklist
# Tracker (Supabase) and writes the "Tasks completed %" figure into each
# pub's KPI dashboard (Firestore) - see sync-tasks.mjs for the full
# explanation. Both APIs are accessed with the same public, client-side
# keys already embedded in the tracker/dashboard pages, so no secrets
# are needed here.
on:
  schedule:
    # GitHub Actions cron is always UTC with no daylight-saving
    # awareness. To actually run at 12pm on the UK clock year-round,
    # both possible UTC times are scheduled every Tuesday - 11:00 (the
    # right one during BST) and 12:00 (the right one during GMT). The
    # script itself checks the real UK-local time and skips whichever
    # of the two isn't actually noon that week, so this only ever does
    # real work once per week.
    - cron: "0 11 * * 2"
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node sync-tasks.mjs
