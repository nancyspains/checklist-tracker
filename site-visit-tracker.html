<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Visit Tracker — Nancy Spains</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; font-size: 15px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 1.5rem 1.25rem; }
h1 { font-size: 20px; font-weight: 500; }
.sub { color: #666; font-size: 13px; margin-top: 2px; }
.header-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 1.25rem; }
.sync { font-size: 12px; color: #666; display: flex; align-items: center; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #3b6d11; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 0.5px solid rgba(0,0,0,0.1); margin-bottom: 1.25rem; }
.tab { font-size: 14px; padding: 6px 14px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.25); background: transparent; color: #555; cursor: pointer; font-family: inherit; }
.tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.btn { font-size: 12px; padding: 5px 12px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.25); background: #fff; color: #333; cursor: pointer; font-family: inherit; }
.btn-dark { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.btn-green { background: #D1FAE5; color: #065F46; border-color: #6EE7B7; }
/* Overview cards */
.metric-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 12px; }
.metric { background: #f0f0ee; border-radius: 8px; padding: 0.875rem 1rem; text-align: center; }
.metric .val { font-size: 22px; font-weight: 500; margin-top: 4px; }
.metric .lbl { font-size: 12px; color: #666; }
.card { background: #fff; border-radius: 12px; border: 0.5px solid rgba(0,0,0,0.08); padding: 1rem 1.25rem; margin-bottom: 10px; cursor: pointer; }
.card:hover { border-color: rgba(0,0,0,0.2); }
.card-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
.visit-bars { display: flex; gap: 4px; margin-bottom: 6px; }
.vbar { flex: 1; height: 6px; border-radius: 3px; background: rgba(0,0,0,0.1); }
.vbar.done { background: #3b6d11; }
.vbar.active { background: #b45309; }
.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 6px; }
.b-green { background: #eaf3de; color: #27500a; }
.b-amber { background: #faeeda; color: #633806; }
.b-red { background: #fcebeb; color: #791f1f; }
.b-gray { background: #f0f0ee; color: #555; }
/* Visit scoring */
.visit-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.vbtn { font-size: 12px; padding: 5px 12px; border-radius: 8px; border: 0.5px solid #ddd; background: #fff; color: #333; cursor: pointer; }
.vbtn.active { border-color: #6366F1; background: #EEF2FF; color: #4338CA; font-weight: 500; }
.vbtn.done { background: #D1FAE5; color: #065F46; border-color: #6EE7B7; }
.vbtn.locked { opacity: 0.45; cursor: not-allowed; }
.banner { padding: 10px 14px; background: #D1FAE5; border-radius: 8px; margin-bottom: 10px; font-size: 13px; color: #065F46; font-weight: 500; }
.cat-block { border: 0.5px solid rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
.cat-head { padding: 8px 14px; background: #fafaf9; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
.cat-score { font-weight: 400; color: #888; font-size: 12px; }
.item-row { padding: 10px 14px; border-top: 0.5px solid rgba(0,0,0,0.07); }
.item-lbl { font-size: 12px; color: #333; margin-bottom: 6px; }
.sbtn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.sbtn { font-size: 11px; padding: 3px 10px; border-radius: 6px; border: 0.5px solid #ddd; background: #fff; color: #666; cursor: pointer; }
.sbtn.a0 { background: #FEE2E2; color: #991B1B; border-color: #FCA5A5; font-weight: 600; }
.sbtn.a1 { background: #FEF3C7; color: #92400E; border-color: #FCD34D; font-weight: 600; }
.sbtn.a2 { background: #D1FAE5; color: #065F46; border-color: #6EE7B7; font-weight: 600; }
.sbtn.a3 { background: #BBF7D0; color: #064E3B; border-color: #34D399; font-weight: 600; }
textarea { width: 100%; font-size: 12px; padding: 8px 10px; border-radius: 8px; border: 0.5px solid #ddd; background: #fff; color: #333; min-height: 72px; resize: vertical; font-family: inherit; }
/* Dashboard */
.week-nav { display: flex; align-items: center; justify-content: center; gap: 16px; background: #fff; border-radius: 12px; padding: 10px 20px; margin-bottom: 12px; border: 0.5px solid rgba(0,0,0,0.08); }
.week-nav button { background: none; border: none; font-size: 18px; cursor: pointer; color: #888; }
.week-nav button:hover { color: #1a1a1a; }
.week-lbl { font-size: 14px; font-weight: 500; }
.w-badge { font-size: 11px; padding: 2px 8px; border-radius: 5px; background: #e8e4ff; color: #5b4fcf; font-weight: 500; margin-left: 6px; }
.vf-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.vf-btn { font-size: 13px; padding: 5px 14px; border-radius: 8px; border: 0.5px solid rgba(0,0,0,0.2); background: transparent; color: #555; cursor: pointer; font-family: inherit; }
.vf-btn.active { border-color: #1a1a1a; background: #fff; color: #1a1a1a; font-weight: 500; }
.dash-section { background: #fff; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; border: 0.5px solid rgba(0,0,0,0.08); }
.sec-title { font-size: 11px; font-weight: 500; color: #888; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-lbl { font-size: 13px; width: 110px; flex-shrink: 0; }
.bar-track { flex: 1; height: 8px; background: #eee; border-radius: 4px; position: relative; overflow: visible; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
.bar-target { position: absolute; top: -3px; height: 14px; width: 2px; background: #ccc; border-radius: 1px; }
.chart-wrap { position: relative; height: 200px; margin-top: 8px; }
.hist-row { display: flex; align-items: flex-start; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid rgba(0,0,0,0.07); }
.hist-row:last-child { border-bottom: none; }
.hist-meta { font-size: 11px; color: #888; margin-top: 2px; }
.empty { text-align: center; color: #aaa; font-size: 13px; padding: 2rem 0; }
.pct-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1>Site Visit Tracker</h1>
      <p class="sub" id="date-lbl"></p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="sync"><span class="dot"></span>Live sync on</span>
      <button class="btn" onclick="newWeek()">New week</button>
      <button class="btn btn-dark" id="save-btn" onclick="saveAll()">Save</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>

<script>
const SB = 'https://vqfvklqdexakwjjyvwod.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxZnZrbHFkZXhha3dqanl2d29kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NDAwNjQsImV4cCI6MjA5MTMxNjA2NH0.JETvur4VrrIWPCwK3MbQ4zzmOiX1Tc7F_xFWC2OR93M';
const VENUES = ['Shoreditch','Monument','Manchester'];
const STDS = [
  { cat:'Cleanliness', items:['Bar tops clean, dry and sanitised','Floors clean — no spillages or debris','No odours in venue','Bathrooms clean, stocked and odour-free'] },
  { cat:'Maintenance', items:['All lighting fully operational','No visible damage to walls, ceilings or floors','All equipment functioning correctly','No leaks at bar, cellar or toilets','Fire exits clear'] },
  { cat:'Staff Presentation', items:['All staff in correct uniform','Uniforms clean and ironed','Staff presenting themselves professionally'] },
  { cat:'Beer Quality', items:['Pints poured correctly — correct head and clarity','Beer served at correct temperature','Beer tastes good'] },
  { cat:'Stock Organisation', items:['Stock neatly stored and labelled','Cellar clean and organised','Back bar clean and fully stocked before service'] },
  { cat:'Music', items:['Volume appropriate — customers can hold a conversation (pre 11pm)','Indie and Irish music playing','Controlled via Soundtrack software'] },
];
const ALL_ITEMS = STDS.flatMap(s=>s.items);
const TARGET = 90;

let tab = 'Overview';
let dashVenue = 'all';
let histVenue = 'all';
let weekOffset = 0;
let history = [];
let trendChart = null;
let visits = {};
let activeIdx = {};
VENUES.forEach(v=>{ visits[v]=[ev(),ev(),ev()]; activeIdx[v]=0; });

function ev(){ return { scores:Object.fromEntries(ALL_ITEMS.map(i=>[i,null])), notes:'', completedAt:null, saved:false, startedDate:null }; }
function today(){ return new Date().toISOString().split('T')[0]; }
function isComplete(v){ return ALL_ITEMS.every(i=>v.scores[i]!==null); }
function isLocked(v){
  // Lock if started on a previous day
  if(v.startedDate && v.startedDate !== today()) return true;
  // Fallback: lock if completed on a previous day
  if(v.completedAt && v.completedAt.split('T')[0] !== today()) return true;
  // Lock if any score was entered on a previous day (belt and braces)
  if(v.savedDate && v.savedDate !== today()) return true;
  return false;
}
function vPct(v){ const s=ALL_ITEMS.filter(i=>v.scores[i]!==null); if(!s.length)return 0; return Math.round(s.reduce((a,i)=>a+v.scores[i],0)/(s.length*3)*100); }
function wPct(venue){ const d=visits[venue].filter(isComplete); if(!d.length)return null; return Math.round(d.reduce((a,v)=>a+vPct(v),0)/d.length); }
function pc(p){ return p>=90?'b-green':p>=80?'b-amber':'b-red'; }
function bc(p){ return p>=90?'#3b6d11':p>=80?'#b45309':'#b91c1c'; }

async function sb(path,opts={}){
  const r=await fetch(`${SB}/rest/v1/${path}`,{...opts,headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json',Prefer:opts.prefer||'return=representation',...(opts.headers||{})}});
  const t=await r.text(); return t?JSON.parse(t):null;
}

async function load(){
  try{
    const r=await sb('config?config_key=eq.site_visit_week&select=config_value');
    if(r&&r.length){ const d=JSON.parse(r[0].config_value); if(d.visits)visits=d.visits; if(d.activeIdx)activeIdx=d.activeIdx; }
  }catch(e){}
  try{ history=await sb('site_visit_history?select=*&order=visited_at.desc&limit=500')||[]; }catch(e){ history=[]; }
  render();
  setInterval(async()=>{ try{ history=await sb('site_visit_history?select=*&order=visited_at.desc&limit=500')||[]; render(); }catch(e){} },15000);
}

async function saveAll(){
  const btn=document.getElementById('save-btn');
  btn.textContent='Saving...'; btn.disabled=true;
  try{
    const val=JSON.stringify({visits,activeIdx});
    // Try PATCH first, if nothing updated then POST
    const patch=await fetch(`${SB}/rest/v1/config?config_key=eq.site_visit_week`,{
      method:'PATCH',
      headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({config_value:val})
    });
    if(patch.status===404||patch.status===0){
      await fetch(`${SB}/rest/v1/config`,{
        method:'POST',
        headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({config_key:'site_visit_week',config_value:val})
      });
    }
  }catch(e){ console.error('Save error:',e); }

  // Archive completed visits to history
  const today=new Date().toISOString().split('T')[0];
  const weekOf=getWeekStart(0).toISOString().split('T')[0];
  for(const venue of VENUES){
    for(let i=0;i<3;i++){
      const v=visits[venue][i];
      if(isComplete(v)&&v.completedAt&&!v.saved){
        try{
          const r=await fetch(`${SB}/rest/v1/site_visit_history`,{
            method:'POST',
            headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
            body:JSON.stringify({venue,visit_number:i+1,visited_at:today,week_of:weekOf,scores:v.scores,notes:v.notes,pct:vPct(v)})
          });
          if(r.ok) visits[venue][i].saved=true;
        }catch(e){ console.error('History error:',e); }
      }
    }
  }
  // Re-save with updated saved flags
  try{
    const val=JSON.stringify({visits,activeIdx});
    await fetch(`${SB}/rest/v1/config?config_key=eq.site_visit_week`,{
      method:'PATCH',
      headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({config_value:val})
    });
  }catch(e){}
  try{ history=await sb('site_visit_history?select=*&order=visited_at.desc&limit=500')||[]; }catch(e){}
  btn.textContent='Saved!'; btn.className='btn btn-green'; btn.disabled=false;
  setTimeout(()=>{ btn.textContent='Save'; btn.className='btn btn-dark'; },2500);
  render();
}

function newWeek(){
  if(!confirm('Start a new week? All visits will be reset. Saved data is preserved in history.'))return;
  VENUES.forEach(v=>{ visits[v]=[ev(),ev(),ev()]; activeIdx[v]=0; });
  saveAll();
}

function setScore(venue,vIdx,item,val){
  if(isLocked(visits[venue][vIdx])) return;
  if(!visits[venue][vIdx].startedDate) visits[venue][vIdx].startedDate = today();
  visits[venue][vIdx].savedDate = today();
  visits[venue][vIdx].scores[item]=val;
  if(isComplete(visits[venue][vIdx])&&!visits[venue][vIdx].completedAt){
    visits[venue][vIdx].completedAt=new Date().toISOString();
    if(vIdx<2) activeIdx[venue]=vIdx+1;
  }
  render();
}

function setNotes(venue,vIdx,val){ visits[venue][vIdx].notes=val; }
function switchTab(t){ tab=t; render(); }
function switchVisit(venue,idx){ activeIdx[venue]=idx; render(); }
function setDashVenue(v){ dashVenue=v; render(); }
function setHistVenue(v){ histVenue=v; render(); }
function prevWeek(){ weekOffset--; render(); }
function nextWeek(){ if(weekOffset<0){weekOffset++;render();} }

function getWeekStart(offset=0){
  const d=new Date(); const day=d.getDay();
  const diff=d.getDate()-day+(day===0?-6:1);
  d.setDate(diff+offset*7); d.setHours(0,0,0,0); return d;
}
function weekLabel(offset){
  const s=getWeekStart(offset); const e=new Date(s); e.setDate(e.getDate()+6);
  const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return `Week ${f(s)} – ${f(e)} ${e.getFullYear()}`;
}
function getWeekData(offset,venue){
  const s=getWeekStart(offset); const e=new Date(s); e.setDate(e.getDate()+7);
  return history.filter(h=>{ const d=new Date(h.visited_at); return d>=s&&d<e&&(venue==='all'||h.venue===venue); });
}
function avg(arr){ return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):null; }

function render(){
  document.getElementById('date-lbl').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const tabNames=['Overview',...VENUES,'Dashboard','History'];
  document.getElementById('tabs').innerHTML=tabNames.map(t=>`<button class="tab ${tab===t?'active':''}" onclick="switchTab('${t}')">${t}</button>`).join('');
  const el=document.getElementById('content');
  if(tab==='Overview') renderOverview(el);
  else if(VENUES.includes(tab)) renderVenue(el,tab);
  else if(tab==='Dashboard') renderDashboard(el);
  else renderHistory(el);
}

function renderOverview(el){
  const totalDone=VENUES.reduce((a,v)=>a+visits[v].filter(isComplete).length,0);
  const allPcts=VENUES.map(v=>wPct(v)).filter(p=>p!==null);
  const overallAvg=avg(allPcts);
  const cards=VENUES.map(v=>{
    const wp=wPct(v); const done=visits[v].filter(isComplete).length;
    const bars=[0,1,2].map(i=>{ const d=isComplete(visits[v][i]); const cur=activeIdx[v]===i&&!d; return `<div class="vbar ${d?'done':cur?'active':''}"></div>`; }).join('');
    const badge=wp!==null?`<span class="badge ${pc(wp)}">${wp}%</span>`:`<span class="badge b-gray">No visits</span>`;
    return `<div class="card" onclick="switchTab('${v}')"><div class="card-title">${v}</div><div style="font-size:11px;color:#888;margin-bottom:4px">${done}/3 visits this week</div><div class="visit-bars">${bars}</div>${badge}</div>`;
  }).join('');
  el.innerHTML=`
    <div class="metric-grid">
      <div class="metric"><div class="lbl">Visits this week</div><div class="val">${totalDone}/9</div></div>
      <div class="metric"><div class="lbl">Avg score</div><div class="val">${overallAvg!==null?overallAvg+'%':'—'}</div></div>
      <div class="metric"><div class="lbl">Venues visited</div><div class="val">${VENUES.filter(v=>visits[v].some(isComplete)).length}/3</div></div>
    </div>
    ${cards}`;
}

function renderVenue(el,venue){
  const wp=wPct(venue);
  const vbtns=visits[venue].map((v,i)=>{
    const done=isComplete(v); const locked=i>0&&!isComplete(visits[venue][i-1]); const active=activeIdx[venue]===i; const dayLocked=isLocked(v);
    let cls='vbtn'+(done?' done':active?' active':locked?' locked':'')+(dayLocked?' locked':'');
    const label=dayLocked?`✓ Visit ${i+1} 🔒`:done?`✓ Visit ${i+1}`:`Visit ${i+1}${locked?' 🔒':''}`;
    return `<button class="${cls}" ${locked||dayLocked?'disabled':''} onclick="${locked||dayLocked?'':`switchVisit('${venue}',${i})`}">${label}</button>`;
  }).join('');
  const weekBadge=wp!==null?`<span class="badge ${pc(wp)}" style="font-size:14px">${wp}% this week</span>`:'';
  const visit=visits[venue][activeIdx[venue]];
  const done=isComplete(visit);
  const dayLocked=isLocked(visit);
  const banner=dayLocked?`<div class="banner" style="background:#FEF3C7;color:#92400E">🔒 This visit was completed on ${visit.startedDate} and is now locked for editing.</div>`:done?`<div class="banner">✓ Visit ${activeIdx[venue]+1} complete — ${vPct(visit)}% · ${activeIdx[venue]<2?`Visit ${activeIdx[venue]+2} now unlocked.`:'All 3 visits complete this week!'}</div>`:'';
  const cats=STDS.map(({cat,items})=>{
    const tot=items.filter(i=>visit.scores[i]!==null).reduce((a,i)=>a+visit.scores[i],0);
    const rows=items.map(item=>{
      const cur=visit.scores[item];
      const btns=[0,1,2,3].map(v=>{ const lbl=['0 — Fail','1 — Below','2 — Meets','3 — Exceeds'][v]; const cls=cur===v?`sbtn a${v}`:'sbtn'; const safe=item.replace(/'/g,"\\'"); return `<button class="${cls}" ${dayLocked?'disabled style="opacity:0.6;cursor:not-allowed"':''} onclick="${dayLocked?'':`setScore('${venue}',${activeIdx[venue]},'${safe}',${v})`}">${lbl}</button>`; }).join('');
      return `<div class="item-row"><div class="item-lbl">${item}</div><div class="sbtn-row">${btns}</div></div>`;
    }).join('');
    return `<div class="cat-block"><div class="cat-head"><span>${cat}</span><span class="cat-score">${tot}/${items.length*3}</span></div>${rows}</div>`;
  }).join('');
  el.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="visit-btns">${vbtns}</div>${weekBadge}
    </div>
    ${banner}${cats}
    <div style="margin-top:8px">
      <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">Actions & notes — Visit ${activeIdx[venue]+1}</label>
      <textarea placeholder="Log any actions, issues or observations..." onchange="setNotes('${venue}',${activeIdx[venue]},this.value)">${visit.notes||''}</textarea>
    </div>`;
}

function renderDashboard(el){
  const data=getWeekData(weekOffset,dashVenue);
  const pcts=data.map(h=>h.pct).filter(p=>p!=null);
  const avgScore=avg(pcts);
  const vbtns=['all',...VENUES].map(v=>`<button class="vf-btn ${dashVenue===v?'active':''}" onclick="setDashVenue('${v}')">${v==='all'?'All pubs':v}</button>`).join('');
  const vBars=( dashVenue==='all'?VENUES:[dashVenue]).map(v=>{
    const vd=getWeekData(weekOffset,v); const va=avg(vd.map(h=>h.pct));
    const badge=va!==null?`<span class="badge ${pc(va)}">${va}%</span>`:`<span class="badge b-gray">No visits</span>`;
    return `<div class="bar-row"><span class="bar-lbl">${v}</span><div class="bar-track"><div class="bar-fill" style="width:${va||0}%;background:${va?bc(va):'#ddd'}"></div><div class="bar-target" style="left:${TARGET}%"></div></div>${badge}</div>`;
  }).join('');
  const stdBars=STDS.map(s=>{
    let t=0,c=0;
    data.forEach(h=>{ if(!h.scores)return; s.items.forEach(item=>{ const v=h.scores[item]; if(v!==null&&v!==undefined){t+=v;c++;} }); });
    const p=c?Math.round((t/(c*3))*100):null;
    const badge=p!==null?`<span class="badge ${pc(p)}">${p}%</span>`:`<span class="badge b-gray">No data</span>`;
    return `<div class="bar-row"><span class="bar-lbl" style="font-size:12px">${s.cat}</span><div class="bar-track"><div class="bar-fill" style="width:${p||0}%;background:${p?bc(p):'#ddd'}"></div><div class="bar-target" style="left:${TARGET}%"></div></div>${badge}</div>`;
  }).join('');
  // Trend chart
  const weeks=Array.from({length:8},(_,i)=>i-7+weekOffset);
  const wLabels=weeks.map(w=>getWeekStart(w).toLocaleDateString('en-GB',{day:'numeric',month:'short'}));
  const vColors={Shoreditch:'#6366F1',Monument:'#F59E0B',Manchester:'#3b6d11'};
  const vShow=dashVenue==='all'?VENUES:[dashVenue];
  el.innerHTML=`
    <div class="week-nav">
      <button onclick="prevWeek()">‹</button>
      <span class="week-lbl">${weekLabel(weekOffset)}</span>
      ${weekOffset===0?`<span class="w-badge">Current week</span>`:''}
      <button onclick="nextWeek()">›</button>
    </div>
    <div class="vf-row">${vbtns}</div>
    <div class="metric-grid">
      <div class="metric"><div class="lbl">Avg score</div><div class="val">${avgScore!==null?avgScore+'%':'—'}</div></div>
      <div class="metric"><div class="lbl">Total visits</div><div class="val">${data.length}</div></div>
      <div class="metric"><div class="lbl">Venues visited</div><div class="val">${[...new Set(data.map(h=>h.venue))].length}${dashVenue==='all'?'/3':''}</div></div>
    </div>
    <div class="dash-section"><div class="sec-title">Visit scores by venue</div>${vBars||'<p class="empty">No data this week</p>'}</div>
    <div class="dash-section"><div class="sec-title">Standards breakdown</div>${stdBars}</div>
    <div class="dash-section"><div class="sec-title">Score trend (last 8 weeks)</div><div class="chart-wrap"><canvas id="trendChart"></canvas></div></div>`;
  if(trendChart){ trendChart.destroy(); trendChart=null; }
  trendChart=new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{ labels:wLabels, datasets:vShow.map(v=>({ label:v, data:weeks.map(w=>avg(getWeekData(w,v).map(h=>h.pct))), borderColor:vColors[v]||'#888', backgroundColor:(vColors[v]||'#888')+'18', tension:0.3, pointRadius:4, spanGaps:true })) },
    options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{min:0,max:100,ticks:{callback:v=>v+'%'},grid:{color:'rgba(0,0,0,0.05)'}}, x:{grid:{display:false}} }, plugins:{ legend:{position:'bottom',labels:{font:{size:12}}} } }
  });
}

function renderHistory(el){
  const hbtns=['all',...VENUES].map(v=>`<button class="vf-btn ${histVenue===v?'active':''}" onclick="setHistVenue('${v}')">${v==='all'?'All pubs':v}</button>`).join('');
  const data=histVenue==='all'?history:history.filter(h=>h.venue===histVenue);
  const rows=data.slice(0,100).map(h=>{
    const d=new Date(h.visited_at).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    const notes=h.notes?`<div style="font-size:11px;color:#888;margin-top:2px;font-style:italic">"${h.notes.slice(0,80)}${h.notes.length>80?'...':''}"</div>`:'';
    return `<div class="hist-row"><div><div style="font-size:14px;font-weight:500">${h.venue} — Visit ${h.visit_number}</div><div class="hist-meta">${d}</div>${notes}</div><span class="badge ${pc(h.pct)}">${h.pct}%</span></div>`;
  }).join('');
  el.innerHTML=`<div class="vf-row">${hbtns}</div><div class="dash-section">${rows||'<p class="empty">No visit history yet.</p>'}</div>`;
}

document.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
