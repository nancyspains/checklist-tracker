<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Visit Tracker — Nancy Spains</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; }
.wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }
h1 { font-size: 20px; font-weight: 600; margin-bottom: 2px; }
.sub { font-size: 13px; color: #666; }
.header-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 1.25rem; }
.btn { font-size: 12px; padding: 6px 14px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #333; cursor: pointer; font-weight: 500; }
.btn:hover { background: #f5f5f5; }
.btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.btn-primary:hover { background: #333; }
.btn-saved { background: #D1FAE5; color: #065F46; border-color: #6EE7B7; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid #ddd; margin-bottom: 1.25rem; flex-wrap: wrap; }
.tab { font-size: 13px; padding: 6px 14px; border-radius: 8px 8px 0 0; border: 1px solid transparent; background: transparent; color: #888; cursor: pointer; margin-bottom: -1px; }
.tab.active { background: #f5f4f0; border-color: #ddd; border-bottom-color: #f5f4f0; color: #1a1a1a; font-weight: 500; }
.card { background: #fff; border-radius: 10px; border: 1px solid #eee; padding: 14px 16px; margin-bottom: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 12px; }
.metric { text-align: center; }
.metric .val { font-size: 24px; font-weight: 600; }
.metric .lbl { font-size: 11px; color: #888; margin-top: 2px; }
.pct-badge { display: inline-block; font-size: 15px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
.green { background: #D1FAE5; color: #065F46; }
.amber { background: #FEF3C7; color: #92400E; }
.red { background: #FEE2E2; color: #991B1B; }
.gray { background: #f0f0f0; color: #555; }
.bar-wrap { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.visit-bars { display: flex; gap: 4px; margin: 8px 0; }
.vbar { flex: 1; height: 6px; border-radius: 3px; background: #eee; }
.vbar.done { background: #10B981; }
.vbar.cur { background: #F59E0B; }
.cat-block { border: 1px solid #eee; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
.cat-head { padding: 8px 14px; background: #fafaf9; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
.cat-score { font-weight: 400; color: #888; font-size: 12px; }
.item-row { padding: 10px 14px; border-top: 1px solid #f0f0f0; }
.item-lbl { font-size: 12px; color: #333; margin-bottom: 6px; }
.score-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.sbtn { font-size: 11px; padding: 3px 10px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; }
.sbtn.a0 { background: #FEE2E2; color: #991B1B; border-color: #FCA5A5; font-weight: 600; }
.sbtn.a1 { background: #FEF3C7; color: #92400E; border-color: #FCD34D; font-weight: 600; }
.sbtn.a2 { background: #D1FAE5; color: #065F46; border-color: #6EE7B7; font-weight: 600; }
.sbtn.a3 { background: #BBF7D0; color: #064E3B; border-color: #34D399; font-weight: 600; }
.visit-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.vbtn { font-size: 12px; padding: 5px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #333; cursor: pointer; }
.vbtn.active { border-color: #6366F1; background: #EEF2FF; color: #4338CA; font-weight: 500; }
.vbtn.done { background: #D1FAE5; color: #065F46; border-color: #6EE7B7; }
.vbtn.locked { opacity: 0.45; cursor: not-allowed; }
.banner { padding: 10px 14px; background: #D1FAE5; border-radius: 8px; margin-bottom: 10px; font-size: 13px; color: #065F46; font-weight: 500; }
textarea { width: 100%; font-size: 12px; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #333; min-height: 72px; resize: vertical; font-family: inherit; }
.hist-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.hist-row:last-child { border-bottom: none; }
.hist-meta { color: #888; font-size: 11px; margin-top: 2px; }
.sync { font-size: 12px; color: #666; display: flex; align-items: center; gap: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; }
.section-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
.chart-wrap { position: relative; height: 220px; }
.footer { font-size: 11px; color: #aaa; text-align: center; margin-top: 1.5rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1>Site Visit Tracker</h1>
      <p class="sub" id="date-lbl"></p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="sync"><span class="dot"></span>Live sync</span>
      <button class="btn" onclick="resetWeek()">New week</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveVisit()">Save visit</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
  <p class="footer">Complete all items in a visit to unlock the next. Saved visits are stored permanently.</p>
</div>

<script>
const SB_URL = 'https://vqfvklqdexakwjjyvwod.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxZnZrbHFkZXhha3dqanl2d29kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM3NjYzNjcsImV4cCI6MjA1OTM0MjM2N30.FwcEGMJSEHKBGVQkLJqxlODQB0DYIlmFm_JkTgxLm_k';

const VENUES = ['Shoreditch','Monument','Manchester'];

const STANDARDS = [
  { cat: 'Cleanliness', items: ['Bar tops clean, dry and sanitised','Floors clean — no spillages or debris','No odours in venue','Bathrooms clean, stocked and odour-free'] },
  { cat: 'Maintenance', items: ['All lighting fully operational','No visible damage to walls, ceilings or floors','All equipment functioning correctly','No leaks at bar, cellar or toilets','Fire exits clear'] },
  { cat: 'Staff Presentation', items: ['All staff in correct uniform','Uniforms clean and ironed','Staff presenting themselves professionally'] },
  { cat: 'Beer Quality', items: ['Pints poured correctly — correct head and clarity','Beer served at correct temperature','Beer tastes good'] },
  { cat: 'Stock Organisation', items: ['Stock neatly stored and labelled','Cellar clean and organised','Back bar clean and fully stocked before service'] },
  { cat: 'Music', items: ['Volume appropriate — customers can hold a conversation (pre 11pm)','Indie and Irish music playing','Controlled via Soundtrack software'] },
];

const ALL_ITEMS = STANDARDS.flatMap(s => s.items);
const MAX_SCORE = ALL_ITEMS.length * 3;

let activeTab = 'Dashboard';
let currentWeek = { visits: {}, activeIdx: {} };
let history = [];
let charts = {};

VENUES.forEach(v => {
  currentWeek.visits[v] = [emptyVisit(), emptyVisit(), emptyVisit()];
  currentWeek.activeIdx[v] = 0;
});

function emptyVisit() {
  return { scores: Object.fromEntries(ALL_ITEMS.map(i => [i, null])), notes: '', completedAt: null };
}

function isComplete(v) { return ALL_ITEMS.every(i => v.scores[i] !== null); }

function visitPct(v) {
  const sc = ALL_ITEMS.filter(i => v.scores[i] !== null);
  if (!sc.length) return 0;
  return Math.round(sc.reduce((a,i) => a + v.scores[i], 0) / (sc.length * 3) * 100);
}

function weeklyPct(venue) {
  const done = currentWeek.visits[venue].filter(isComplete);
  if (!done.length) return null;
  const t = done.reduce((a,v) => a + visitPct(v), 0);
  return Math.round(t / done.length);
}

function pctClass(p) { return p >= 90 ? 'green' : p >= 80 ? 'amber' : 'red'; }
function barCol(p) { return p >= 90 ? '#10B981' : p >= 80 ? '#F59E0B' : '#EF4444'; }

async function sb(path, opts = {}) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json', Prefer: opts.prefer || 'return=representation', ...(opts.headers||{}) }
  });
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

async function loadHistory() {
  try {
    const rows = await sb('site_visit_history?select=*&order=visited_at.desc&limit=100');
    history = rows || [];
  } catch(e) { history = []; }
}

async function loadCurrentWeek() {
  try {
    const rows = await sb('config?config_key=eq.site_visit_current_week&select=config_value');
    if (rows && rows.length) {
      const d = JSON.parse(rows[0].config_value);
      if (d.visits) currentWeek.visits = d.visits;
      if (d.activeIdx) currentWeek.activeIdx = d.activeIdx;
    }
  } catch(e) {}
}

async function saveCurrentWeek() {
  const val = JSON.stringify({ visits: currentWeek.visits, activeIdx: currentWeek.activeIdx });
  try {
    const ex = await sb('config?config_key=eq.site_visit_current_week&select=id');
    if (ex && ex.length) {
      await sb('config?config_key=eq.site_visit_current_week', { method: 'PATCH', body: JSON.stringify({ config_value: val }) });
    } else {
      await sb('config', { method: 'POST', body: JSON.stringify({ config_key: 'site_visit_current_week', config_value: val }) });
    }
  } catch(e) {}
}

async function saveVisit() {
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Saving...'; btn.disabled = true;

  // Save current week state
  await saveCurrentWeek();

  // Save completed visits to history
  const today = new Date().toISOString().split('T')[0];
  for (const venue of VENUES) {
    for (let i = 0; i < 3; i++) {
      const v = currentWeek.visits[venue][i];
      if (isComplete(v) && v.completedAt && !v.savedToHistory) {
        try {
          await sb('site_visit_history', {
            method: 'POST',
            prefer: 'return=minimal',
            body: JSON.stringify({
              venue,
              visit_number: i + 1,
              visited_at: today,
              week_of: getWeekStart(),
              scores: v.scores,
              notes: v.notes,
              pct: visitPct(v)
            })
          });
          currentWeek.visits[venue][i].savedToHistory = true;
        } catch(e) {}
      }
    }
  }

  await saveCurrentWeek();
  await loadHistory();

  btn.textContent = 'Saved!'; btn.className = 'btn btn-saved';
  setTimeout(() => { btn.textContent = 'Save visit'; btn.className = 'btn btn-primary'; btn.disabled = false; }, 2500);
  render();
}

function getWeekStart() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(d.setDate(diff));
  return mon.toISOString().split('T')[0];
}

async function resetWeek() {
  if (!confirm('Start a new week? Current week data is saved in history.')) return;
  VENUES.forEach(v => {
    currentWeek.visits[v] = [emptyVisit(), emptyVisit(), emptyVisit()];
    currentWeek.activeIdx[v] = 0;
  });
  await saveCurrentWeek();
  render();
}

function setScore(venue, vIdx, item, val) {
  currentWeek.visits[venue][vIdx].scores[item] = val;
  if (isComplete(currentWeek.visits[venue][vIdx]) && !currentWeek.visits[venue][vIdx].completedAt) {
    currentWeek.visits[venue][vIdx].completedAt = new Date().toISOString();
    if (vIdx < 2) currentWeek.activeIdx[venue] = vIdx + 1;
  }
  render();
}

function setNotes(venue, vIdx, val) { currentWeek.visits[venue][vIdx].notes = val; }
function switchTab(t) { activeTab = t; render(); }
function switchVisit(venue, idx) { currentWeek.activeIdx[venue] = idx; render(); }

// ── RENDER ──────────────────────────────────────────────────────────────────

function render() {
  document.getElementById('date-lbl').textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  const tabNames = ['Dashboard', ...VENUES, 'History'];
  document.getElementById('tabs').innerHTML = tabNames.map(t =>
    `<button class="tab ${activeTab===t?'active':''}" onclick="switchTab('${t}')">${t}</button>`
  ).join('');

  const el = document.getElementById('content');

  if (activeTab === 'Dashboard') renderDashboard(el);
  else if (VENUES.includes(activeTab)) renderVenue(el, activeTab);
  else if (activeTab === 'History') renderHistory(el);
}

function renderDashboard(el) {
  // Stats
  const totalVisits = history.length;
  const allPcts = history.map(h => h.pct).filter(Boolean);
  const avgPct = allPcts.length ? Math.round(allPcts.reduce((a,b)=>a+b,0)/allPcts.length) : null;
  const thisWeek = history.filter(h => h.week_of === getWeekStart());

  // Venue cards
  const cards = VENUES.map(v => {
    const wp = weeklyPct(v);
    const done = currentWeek.visits[v].filter(isComplete).length;
    const bars = [0,1,2].map(i => {
      const vis = currentWeek.visits[v][i];
      const d = isComplete(vis);
      const cur = currentWeek.activeIdx[v] === i && !d;
      return `<div class="vbar ${d?'done':cur?'cur':''}"></div>`;
    }).join('');
    const badge = wp !== null ? `<span class="pct-badge ${pctClass(wp)}">${wp}%</span>` : `<span style="font-size:12px;color:#aaa">No visits complete</span>`;
    return `<div class="card" style="cursor:pointer" onclick="switchTab('${v}')">
      <div style="font-size:13px;font-weight:600;margin-bottom:4px">${v}</div>
      <div style="font-size:11px;color:#888;margin-bottom:2px">${done}/3 visits this week</div>
      <div class="visit-bars">${bars}</div>
      ${badge}
    </div>`;
  }).join('');

  // Historic venue avg
  const venueAvgs = VENUES.map(v => {
    const vHist = history.filter(h => h.venue === v);
    const avg = vHist.length ? Math.round(vHist.reduce((a,h)=>a+h.pct,0)/vHist.length) : null;
    return `<div class="hist-row">
      <span style="font-weight:500">${v}</span>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:12px;color:#888">${vHist.length} visits</span>
        ${avg !== null ? `<span class="pct-badge ${pctClass(avg)}" style="font-size:13px">${avg}%</span>` : '<span style="color:#aaa;font-size:12px">No data</span>'}
      </div>
    </div>`;
  }).join('');

  // Category avgs from history
  const catAvgs = STANDARDS.map(s => {
    const catItems = s.items;
    let total = 0, count = 0;
    history.forEach(h => {
      catItems.forEach(item => {
        if (h.scores && h.scores[item] !== null && h.scores[item] !== undefined) {
          total += h.scores[item]; count++;
        }
      });
    });
    const avg = count ? Math.round((total / count / 3) * 100) : null;
    return { cat: s.cat, avg };
  });

  const catRows = catAvgs.map(c =>
    `<div class="hist-row">
      <span style="font-size:13px">${c.cat}</span>
      ${c.avg !== null ?
        `<div style="display:flex;align-items:center;gap:10px;flex:1;margin-left:16px">
          <div class="bar-wrap" style="flex:1"><div class="bar-fill" style="width:${c.avg}%;background:${barCol(c.avg)}"></div></div>
          <span class="pct-badge ${pctClass(c.avg)}" style="font-size:12px;min-width:48px;text-align:center">${c.avg}%</span>
        </div>` :
        '<span style="color:#aaa;font-size:12px">No data</span>'
      }
    </div>`
  ).join('');

  el.innerHTML = `
    <div class="grid3" style="margin-bottom:12px">
      <div class="card metric"><div class="val">${totalVisits}</div><div class="lbl">Total visits</div></div>
      <div class="card metric"><div class="val">${avgPct !== null ? avgPct+'%' : '—'}</div><div class="lbl">Avg score</div></div>
      <div class="card metric"><div class="val">${thisWeek.length}</div><div class="lbl">Visits this week</div></div>
    </div>
    <div class="grid3">${cards}</div>
    <div class="grid2">
      <div class="card">
        <div class="section-title">Venue averages (all time)</div>
        ${venueAvgs || '<p style="color:#aaa;font-size:13px">No history yet</p>'}
      </div>
      <div class="card">
        <div class="section-title">Standards performance</div>
        ${catRows || '<p style="color:#aaa;font-size:13px">No history yet</p>'}
      </div>
    </div>
    <div class="card">
      <div class="section-title">Score trend (last 12 visits)</div>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>`;

  // Trend chart
  const last12 = [...history].reverse().slice(0, 12);
  if (last12.length && !charts.trend) {
    const ctx = document.getElementById('trendChart');
    if (ctx) {
      const vColors = { Shoreditch: '#6366F1', Monument: '#F59E0B', Manchester: '#10B981' };
      const datasets = VENUES.map(v => ({
        label: v,
        data: last12.filter(h => h.venue === v).map(h => ({ x: h.visited_at, y: h.pct })),
        borderColor: vColors[v],
        backgroundColor: vColors[v] + '22',
        tension: 0.3,
        pointRadius: 4,
      }));
      charts.trend = new Chart(ctx, {
        type: 'line',
        data: { datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } }, x: { type: 'category' } },
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }
  }
}

function renderVenue(el, venue) {
  const activeIdx = currentWeek.activeIdx[venue];
  const wp = weeklyPct(venue);

  const visitBtns = currentWeek.visits[venue].map((v, i) => {
    const done = isComplete(v);
    const locked = i > 0 && !isComplete(currentWeek.visits[venue][i-1]);
    const active = activeIdx === i;
    let cls = 'vbtn' + (done?' done':active?' active':locked?' locked':'');
    return `<button class="${cls}" ${locked?'disabled':''} onclick="${locked?'':`switchVisit('${venue}',${i})`}">${done?'✓ ':''}Visit ${i+1}${locked?' 🔒':''}</button>`;
  }).join('');

  const weekBadge = wp !== null ? `<span class="pct-badge ${pctClass(wp)}">${wp}% this week</span>` : '';

  const visit = currentWeek.visits[venue][activeIdx];
  const done = isComplete(visit);
  const banner = done ? `<div class="banner">✓ Visit ${activeIdx+1} complete — ${visitPct(visit)}% · ${activeIdx<2?`Visit ${activeIdx+2} now unlocked.`:'All 3 visits complete this week!'}</div>` : '';

  const cats = STANDARDS.map(({ cat, items }) => {
    const total = items.filter(i => visit.scores[i]!==null).reduce((a,i)=>a+visit.scores[i],0);
    const max = items.length * 3;
    const rows = items.map(item => {
      const cur = visit.scores[item];
      const btns = [0,1,2,3].map(v => {
        const lbl = ['0 — Fail','1 — Below','2 — Meets','3 — Exceeds'][v];
        const cls = cur===v ? `sbtn a${v}` : 'sbtn';
        const safe = item.replace(/'/g,"\\'");
        return `<button class="${cls}" onclick="setScore('${venue}',${activeIdx},'${safe}',${v})">${lbl}</button>`;
      }).join('');
      return `<div class="item-row"><div class="item-lbl">${item}</div><div class="score-btns">${btns}</div></div>`;
    }).join('');
    return `<div class="cat-block"><div class="cat-head"><span>${cat}</span><span class="cat-score">${total}/${max}</span></div>${rows}</div>`;
  }).join('');

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="visit-btns">${visitBtns}</div>
      ${weekBadge}
    </div>
    ${banner}
    ${cats}
    <div style="margin-top:8px">
      <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">Actions & notes — Visit ${activeIdx+1}</label>
      <textarea placeholder="Log any actions, issues or observations..." onchange="setNotes('${venue}',${activeIdx},this.value)">${visit.notes||''}</textarea>
    </div>`;
}

function renderHistory(el) {
  if (!history.length) {
    el.innerHTML = '<div class="card" style="text-align:center;color:#aaa;font-size:13px;padding:2rem">No visit history yet. Complete and save visits to see them here.</div>';
    return;
  }

  const rows = history.slice(0, 50).map(h => {
    const d = new Date(h.visited_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    return `<div class="hist-row">
      <div>
        <div style="font-weight:500">${h.venue} — Visit ${h.visit_number}</div>
        <div class="hist-meta">${d} · Week of ${h.week_of}</div>
        ${h.notes ? `<div style="font-size:11px;color:#888;margin-top:2px;font-style:italic">"${h.notes.slice(0,80)}${h.notes.length>80?'...':''}"</div>` : ''}
      </div>
      <span class="pct-badge ${pctClass(h.pct)}">${h.pct}%</span>
    </div>`;
  }).join('');

  // Per venue history
  const venueHistory = VENUES.map(v => {
    const vRows = history.filter(h => h.venue === v).slice(0, 5).map(h => {
      const d = new Date(h.visited_at).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
      return `<div class="hist-row"><span style="font-size:12px">${d} · Visit ${h.visit_number}</span><span class="pct-badge ${pctClass(h.pct)}" style="font-size:12px">${h.pct}%</span></div>`;
    }).join('');
    return `<div class="card"><div class="section-title">${v}</div>${vRows || '<p style="color:#aaa;font-size:12px">No visits yet</p>'}</div>`;
  }).join('');

  el.innerHTML = `
    <div class="card">
      <div class="section-title">All visits (most recent first)</div>
      ${rows}
    </div>
    <div class="grid3">${venueHistory}</div>`;
}

// ── INIT ─────────────────────────────────────────────────────────────────────
(async () => {
  await Promise.all([loadCurrentWeek(), loadHistory()]);
  render();
})();
</script>
</body>
</html>
